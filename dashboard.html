<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy Plus - Dashboard</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:Arial}main{max-width:900px;margin:auto;padding:20px}.card{background:#151c2f;border:1px solid #33415f;border-radius:18px;padding:20px;margin:12px 0}input,button{width:100%;padding:14px;margin:7px 0;border-radius:12px;border:1px solid #33415f;background:#0f172a;color:#fff;font-size:16px}button{background:#2563eb;border:0;font-weight:bold}.secondary{background:#334155}.hidden{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0f172a;padding:15px;border-radius:12px}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #33415f;padding:12px 0}.muted{color:#94a3b8}.error{color:#fca5a5}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><section id="login"><div class="card"><h1>Energy Plus</h1><h2>دخول المدير</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="pass" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button><p id="msg" class="error"></p></div></section><section id="dash" class="hidden"><div class="card"><div class="row"><h1>لوحة المدير</h1><button style="width:auto" class="secondary" onclick="logout()">خروج</button></div><div class="grid"><div class="stat">الموظفون<br><b id="count">0</b></div><div class="stat">حضور مفتوح<br><b id="open">0</b></div></div></div><div class="card"><h2>الموظفون</h2><div id="employees"></div></div><div class="card"><h2>تقرير الحضور</h2><input id="from" type="date"><input id="to" type="date"><button onclick="report()">عرض التقرير</button><button class="secondary" onclick="csv()">تصدير CSV</button><div id="rows"></div></div></section></main><script>const F='https://kfrshaagrcggcjalsjdu.supabase.co/functions/v1/employee-kiosk';let token='',rows=[];const $=x=>document.getElementById(x);async function api(action,body={}){let r=await fetch(F,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify({action,...body})}),j=await r.json();if(!r.ok)throw Error(j.error||'حدث خطأ');return j}async function login(){try{let j=await api('manager_login',{email:$('email').value.trim(),password:$('pass').value});token=j.session.access_token;localStorage.setItem('energy_manager_token',token);show();await summary()}catch(e){$('msg').textContent=e.message}}function show(){ $('login').classList.add('hidden');$('dash').classList.remove('hidden')}function logout(){token='';localStorage.removeItem('energy_manager_token');location.reload()}async function summary(){try{let j=await api('manager_summary');$('count').textContent=j.employees.length;$('open').textContent=j.open.length;$('employees').innerHTML=j.employees.map(e=>`<div class="row"><div><b>${e.full_name}</b><div class="muted">${e.branch||''} - ${e.department||''}</div></div><div>${j.open.some(a=>a.employee_id===e.id)?'حاضر':'غائب'}</div></div>`).join('')}catch(e){logout()}}async function report(){try{let j=await api('manager_report',{from:$('from').value,to:$('to').value});rows=j.rows;$('rows').innerHTML=rows.map(r=>`<div class="row"><div><b>${r.profiles?.full_name||''}</b><div class="muted">${r.profiles?.branch||''} - ${r.profiles?.department||''}<br>${new Date(r.check_in).toLocaleString('ar-EG')}</div></div><div>${r.check_out?((new Date(r.check_out)-new Date(r.check_in))/3600000).toFixed(2)+' ساعة':'مفتوح'}</div></div>`).join('')||'<p class="muted">لا توجد نتائج</p>'}catch(e){$('rows').textContent=e.message}}function csv(){if(!rows.length)return alert('اعرض التقرير أولاً');let a=[['الاسم','الفرع','القسم','الحضور','الانصراف','الساعات'],...rows.map(r=>[r.profiles?.full_name||'',r.profiles?.branch||'',r.profiles?.department||'',r.check_in,r.check_out||'',r.check_out?((new Date(r.check_out)-new Date(r.check_in))/3600000).toFixed(2):''])];let b=new Blob(['\ufeff'+a.map(x=>x.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv'}),x=document.createElement('a');x.href=URL.createObjectURL(b);x.download='attendance-report.csv';x.click()}(async()=>{token=localStorage.getItem('energy_manager_token')||'';if(token){try{show();await summary()}catch(e){logout()}}})();</script></body></html>
