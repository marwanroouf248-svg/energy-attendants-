<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy Plus - Dashboard</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:Arial}main{max-width:1100px;margin:auto;padding:20px}.card{background:#151c2f;border:1px solid #33415f;border-radius:18px;padding:20px;margin:12px 0}input,select,button{width:100%;padding:14px;margin:7px 0;border-radius:12px;border:1px solid #33415f;background:#0f172a;color:#fff;font-size:16px;box-sizing:border-box}button{background:#2563eb;border:0;font-weight:bold;cursor:pointer}.secondary{background:#334155}.success{background:#15803d}.danger{background:#991b1b}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0f172a;padding:15px;border-radius:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #33415f;padding:12px 0}.muted{color:#94a3b8}.error{color:#fca5a5}.total{color:#86efac;font-weight:bold}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.employee-card{background:#0f172a;border:1px solid #33415f;border-radius:14px;padding:14px;margin:8px 0}.employee-card button{width:auto;margin:0;padding:9px 14px}.print-only{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}}@media print{body{background:#fff;color:#000}main{max-width:none;padding:0}.no-print{display:none!important}.print-only{display:block}.card{border:0;background:#fff;color:#000;padding:0}.print-table{width:100%;border-collapse:collapse;margin-top:15px}.print-table th,.print-table td{border:1px solid #999;padding:8px;text-align:right}.print-header{margin-bottom:15px}.muted{color:#555}.total{color:#000}}
</style></head><body><main><section id="login"><div class="card"><h1>Energy Plus</h1><h2>دخول المدير</h2><input id="pin" type="password" placeholder="أدخل الكود"><button onclick="login()">دخول</button><p id="msg" class="error"></p></div></section><section id="dash" class="hidden"><div class="card no-print"><div class="row"><h1>لوحة المدير</h1><div style="display:flex;gap:8px"><a href="./" style="align-self:center;color:#94a3b8;font-size:14px;text-decoration:none">تسجيل حضور</a><button style="width:auto" class="secondary" onclick="logout()">خروج</button></div></div><div class="grid"><div class="stat">الموظفون<br><b id="count">0</b></div><div class="stat">حضور مفتوح<br><b id="open">0</b></div><div class="stat">الساعات بالتقرير<br><b id="grandHours">0</b></div><div class="stat">عدد السجلات<br><b id="recordCount">0</b></div></div></div><div class="card no-print"><h2>الموظفون</h2><div id="employees"></div></div><div class="card no-print"><h2>تقرير الحضور وإجمالي الساعات</h2><div class="grid" style="grid-template-columns:1fr 1fr 2fr"><input id="from" type="date"><input id="to" type="date"><select id="employeeFilter"><option value="">كل الموظفين</option></select></div><button onclick="report()">عرض التقرير</button><div class="actions"><button class="success" onclick="csv()">تصدير CSV</button><button class="secondary" onclick="printEmployee()">PDF لموظف محدد</button><button class="secondary" onclick="printAll()">PDF لكل الموظفين</button></div><h3>إجمالي الساعات لكل موظف</h3><div id="totals"></div><h3>تفاصيل الحضور والانصراف</h3><div id="rows"></div></div><section id="printArea" class="print-only"></section></section></main><script>const F='https://kfrshaagrcggcjalsjdu.supabase.co/functions/v1/employee-kiosk';let token='',rows=[],employees=[];const $=x=>document.getElementById(x);async function api(action,body={}){let r=await fetch(F,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify({action,...body})}),j=await r.json();if(!r.ok)throw Error(j.error||'حدث خطأ');return j}const FIXED_CODE='Marwan12345@';const MGR_EMAIL='marwanroouf248@gmail.com';const MGR_PASS='Marwan12345@';async function login(){try{if($('pin').value!==FIXED_CODE){$('msg').textContent='كود غير صحيح';return}let j=await api('manager_login',{email:MGR_EMAIL,password:MGR_PASS});token=j.session.access_token;localStorage.setItem('energy_manager_token',token);show();await summary()}catch(e){$('msg').textContent=e.message}}function show(){$('login').classList.add('hidden');$('dash').classList.remove('hidden')}function logout(){token='';localStorage.removeItem('energy_manager_token');location.reload()}async function summary(){try{let j=await api('manager_summary');employees=j.employees||[];$('count').textContent=employees.length;$('open').textContent=(j.open||[]).length;$('employees').innerHTML=employees.map(e=>`<div class="employee-card"><div class="row"><div><b>${esc(e.full_name)}</b><div class="muted">${esc(e.branch||'')} - ${esc(e.department||'')}</div></div><div>${(j.open||[]).some(a=>a.employee_id===e.id)?'حاضر':'غائب'}</div></div></div>`).join('');$('employeeFilter').innerHTML='<option value="">كل الموظفين</option>'+employees.map(e=>`<option value="${e.id}">${esc(e.full_name)}</option>`).join('')}catch(e){logout()}}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function hours(r){return r.check_out?Math.max(0,(new Date(r.check_out)-new Date(r.check_in))/3600000):0}function fmtDate(v){return v?new Date(v).toLocaleString('ar-EG'):'—'}function getTotals(){let totals={};rows.forEach(r=>{let e=r.profiles||{};let key=r.employee_id;if(!totals[key])totals[key]={id:key,name:e.full_name||'',branch:e.branch||'',department:e.department||'',hours:0,open:0,count:0};totals[key].count++;if(r.check_out)totals[key].hours+=hours(r);else totals[key].open++});return Object.values(totals).sort((a,b)=>b.hours-a.hours)}async function report(){try{let body={from:$('from').value,to:$('to').value};if($('employeeFilter').value)body.employee_id=$('employeeFilter').value;let j=await api('manager_report',body);rows=j.rows||[];let totals=getTotals();$('grandHours').textContent=totals.reduce((s,t)=>s+t.hours,0).toFixed(2);$('recordCount').textContent=rows.length;$('totals').innerHTML=totals.map(t=>`<div class="row"><div><b>${esc(t.name)}</b><div class="muted">${esc(t.branch)} - ${esc(t.department)} | ${t.count} سجل</div></div><div class="total">${t.hours.toFixed(2)} ساعة${t.open?' + حضور مفتوح':''}</div></div>`).join('')||'<p class="muted">لا توجد نتائج</p>';$('rows').innerHTML=rows.map(r=>`<div class="row"><div><b>${esc(r.profiles?.full_name||'')}</b><div class="muted">${esc(r.profiles?.branch||'')} - ${esc(r.profiles?.department||'')}<br>حضور: ${fmtDate(r.check_in)}<br>انصراف: ${r.check_out?fmtDate(r.check_out):'لم يسجل بعد'}</div></div><div>${r.check_out?hours(r).toFixed(2)+' ساعة':'مفتوح'}</div></div>`).join('')||'<p class="muted">لا توجد نتائج</p>'}catch(e){$('rows').textContent=e.message}}function csv(){if(!rows.length)return alert('اعرض التقرير أولاً');let a=[['الاسم','الفرع','القسم','الحضور','الانصراف','الساعات'],...rows.map(r=>[r.profiles?.full_name||'',r.profiles?.branch||'',r.profiles?.department||'',fmtDate(r.check_in),r.check_out?fmtDate(r.check_out):'',r.check_out?hours(r).toFixed(2):''])];let b=new Blob(['\ufeff'+a.map(x=>x.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv;charset=utf-8'}),x=document.createElement('a');x.href=URL.createObjectURL(b);x.download='energy-plus-attendance-report.csv';x.click();URL.revokeObjectURL(x.href)}function buildPrint(employeeId=''){let rs=employeeId?rows.filter(r=>r.employee_id===employeeId):rows;let totals={};rs.forEach(r=>{let e=r.profiles||{};let k=r.employee_id;if(!totals[k])totals[k]={name:e.full_name||'',branch:e.branch||'',department:e.department||'',hours:0};if(r.check_out)totals[k].hours+=hours(r)});let title=employeeId&&totals[employeeId]?`تقرير حضور الموظف: ${esc(totals[employeeId].name)}`:'تقرير حضور الموظفين';$('printArea').innerHTML=`<div class="print-header"><h1>Energy Plus</h1><h2>${title}</h2><p>الفترة: ${esc($('from').value||'كل الفترة')} إلى ${esc($('to').value||'كل الفترة')}</p></div><table class="print-table"><thead><tr><th>الموظف</th><th>الفرع</th><th>القسم</th><th>إجمالي الساعات</th></tr></thead><tbody>${Object.values(totals).map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.branch)}</td><td>${esc(t.department)}</td><td>${t.hours.toFixed(2)}</td></tr>`).join('')}</tbody></table><h3>تفاصيل الحضور</h3><table class="print-table"><thead><tr><th>الموظف</th><th>التاريخ والوقت</th><th>الانصراف</th><th>الساعات</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.profiles?.full_name||'')}</td><td>${fmtDate(r.check_in)}</td><td>${r.check_out?fmtDate(r.check_out):'مفتوح'}</td><td>${r.check_out?hours(r).toFixed(2):'—'}</td></tr>`).join('')}</tbody></table>`}function printEmployee(){if(!rows.length)return alert('اعرض التقرير أولاً');let id=$('employeeFilter').value;if(!id)return alert('اختر موظفًا أولاً');buildPrint(id);window.print()}function printAll(){if(!rows.length)return alert('اعرض التقرير أولاً');buildPrint();window.print()}(async()=>{token=localStorage.getItem('energy_manager_token')||'';if(token){try{show();await summary()}catch(e){logout()}}})();</script></body></html>
