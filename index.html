<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy Plus</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:Arial;text-align:center}main{max-width:700px;margin:auto;padding:20px}.card{background:#151c2f;border:1px solid #33415f;border-radius:18px;padding:20px;margin:12px 0}button{display:block;width:100%;padding:15px;margin:9px 0;border:0;border-radius:12px;background:#2563eb;color:#fff;font-size:18px;font-weight:bold}.secondary{background:#334155}.danger{background:#dc2626}.hidden{display:none}.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}.names button{margin:0;background:#1e293b}.muted{color:#94a3b8}.row{display:flex;justify-content:space-between;border-bottom:1px solid #33415f;padding:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#0f172a;padding:15px;border-radius:12px}@media(max-width:500px){.names,.grid{grid-template-columns:1fr}}</style></head><body><main><section id="home"><div class="card"><h1>Energy Plus</h1><p class="muted">اختار الفرع</p><button onclick="branch('فرع الرخاوي')">فرع الرخاوي</button><button onclick="branch('فرع فودافون')">فرع فودافون</button></div></section><section id="deps" class="hidden"><div class="card"><h2 id="bt"></h2><p class="muted">اختار القسم</p><button onclick="dep('سيلز')">سيلز</button><button onclick="dep('كوتش')">كوتش</button><button onclick="dep('هاوس كيبنج')">هاوس كيبنج</button><button class="secondary" onclick="home()">رجوع</button></div></section><section id="list" class="hidden"><div class="card"><h2 id="dt"></h2><div id="names" class="names"></div><button class="secondary" onclick="show('list',0);show('deps',1)">رجوع</button></div></section><section id="emp" class="hidden"><div class="card"><h2 id="en"></h2><div class="grid"><div class="stat">الحالة<br><b id="st">غير حاضر</b></div><div class="stat">الوقت<br><b id="tm">00:00:00</b></div></div><button id="in">تسجيل حضور</button><button id="out" class="danger hidden">تسجيل انصراف</button><p id="msg"></p><h3>السجل</h3><div id="hist"></div><button class="secondary" onclick="home()">رجوع</button></div></section></main><script>const F='https://kfrshaagrcggcjalsjdu.supabase.co/functions/v1/employee-kiosk';let B='',D='',E=null,O=null,T;const $=x=>document.getElementById(x),show=(x,v)=>$(x).classList.toggle('hidden',!v),tm=x=>{let s=Math.floor(x/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),q=s%60;return[h,m,q].map(a=>String(a).padStart(2,'0')).join(':')};async function api(o){let r=await fetch(F,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}),j=await r.json();if(!r.ok)throw Error(j.error||'حدث خطأ');return j}function branch(x){B=x;$('bt').textContent=x;show('home',0);show('deps',1)}function dep(x){D=x;$('dt').textContent=B+' - '+x;show('deps',0);show('list',1);load()}function home(){if(T)clearInterval(T);E=null;O=null;show('deps',0);show('list',0);show('emp',0);show('home',1)}async function load(){try{let j=await api({action:'employees'}),a=(j.employees||[]).filter(x=>x.active!==false&&x.branch===B&&x.department===D);$('names').innerHTML=a.map(x=>`<button onclick="pick('${x.id}')">${x.full_name}</button>`).join('')||'<p class="muted">لا يوجد موظفون حاليًا</p>'}catch(e){$('names').innerHTML='<p>'+e.message+'</p>'}}async function pick(x){E=x;show('list',0);show('emp',1);await status()}async function status(){try{let j=await api({action:'status',employee_id:E});$('en').textContent=j.employee.full_name;O=j.open||null;show('in',!O);show('out',!!O);$('st').textContent=O?'حاضر':'غير حاضر';if(T)clearInterval(T);let tick=()=>$('tm').textContent=O?tm(Date.now()-new Date(O.check_in).getTime()):'00:00:00';tick();if(O)T=setInterval(tick,1000);$('hist').innerHTML=(j.data||[]).map(r=>`<div class="row"><span>${new Date(r.check_in).toLocaleString('ar-EG')}</span><span>${r.check_out?tm(new Date(r.check_out)-new Date(r.check_in)):'مفتوح'}</span></div>`).join('')||'<p class="muted">لا يوجد سجل</p>'}catch(e){$('msg').textContent=e.message}}$('in').onclick=async()=>{try{await api({action:'check_in',employee_id:E});$('msg').textContent='تم تسجيل الحضور';await status()}catch(e){$('msg').textContent=e.message}};$('out').onclick=async()=>{try{await api({action:'check_out',employee_id:E});$('msg').textContent='تم تسجيل الانصراف';await status()}catch(e){$('msg').textContent=e.message}};</script></body></html>
