<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Energy Plus - Gym Staff</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#f8fafc}main{max-width:760px;margin:auto;padding:24px 16px 48px}.card{background:#151c2f;border:1px solid #26314a;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 8px 30px #0003}h1,h2{margin:0 0 14px}input,button{width:100%;padding:14px;border-radius:12px;border:1px solid #33415f;background:#0f172a;color:white;font-size:16px;margin:6px 0}button{background:#2563eb;border:0;font-weight:700;cursor:pointer}button.danger{background:#dc2626}button.secondary{background:#334155}.hidden{display:none!important}.muted{color:#94a3b8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;background:#0f172a;border-radius:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #26314a;padding:12px 0}.row:last-child{border-bottom:0}.pill{padding:5px 9px;border-radius:999px;background:#14532d}.error{color:#fca5a5}.success{color:#86efac}.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nameBtn{background:#1e293b;border:1px solid #33415f}.center{text-align:center}@media(max-width:520px){.names{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}</style></head><body><main><section id="kiosk"><div class="card center"><h1>Energy Plus</h1><p class="muted">تسجيل حضور وانصراف الموظفين</p><div id="employeeList" class="names"></div><p id="kioskMsg" class="error"></p><button id="managerLoginBtn" class="secondary">دخول المدير</button></div></section><section id="employeeView" class="hidden"><div class="card"><div class="row"><div><h1>Energy Plus</h1><div id="employeeName" class="muted"></div></div><button id="employeeBack" class="secondary" style="width:auto">رجوع</button></div></div><div class="card"><h2>الحضور والانصراف</h2><div class="grid"><div class="stat"><div class="muted">الحالة</div><strong id="status">غير حاضر</strong></div><div class="stat"><div class="muted">الوقت</div><strong id="timer">00:00:00</strong></div></div><button id="checkIn">تسجيل حضور</button><button id="checkOut" class="danger hidden">تسجيل انصراف</button><p id="employeeMsg" class="error"></p><h2 style="margin-top:22px">سجلي</h2><div id="myHistory"></div></div></section><section id="managerLogin" class="hidden"><div class="card"><h1>دخول المدير</h1><input id="loginId" type="email" placeholder="البريد الإلكتروني" autocomplete="username"><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button id="loginBtn">دخول</button><button id="backToKiosk" class="secondary">رجوع</button><p id="loginMsg" class="error"></p></div></section><section id="managerView" class="hidden"><div class="card"><div class="row"><h2>لوحة المدير</h2><button id="logout" class="secondary" style="width:auto">خروج</button></div><div class="grid"><div class="stat"><div class="muted">الموظفون</div><strong id="employeeCount">0</strong></div><div class="stat"><div class="muted">حضور مفتوح</div><strong id="openCount">0</strong></div></div></div><div class="card"><h2>الموظفون</h2><div id="employees"></div></div><div class="card"><h2>تقرير الحضور</h2><input id="from" type="date"><input id="to" type="date"><button id="reportBtn">عرض التقرير</button><button id="csvBtn" class="secondary">تصدير CSV</button><div id="report"></div></div></section></main><script>const SUPABASE_URL='https://kfrshaagrcggcjalsjdu.supabase.co',SUPABASE_KEY='sb_publishable_mKftrB-itebmeA-bdtt6dw_Q3QnxH0_';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),FN=SUPABASE_URL+'/functions/v1/employee-kiosk';let selected=null,open=null,timerInt=null,reportRows=[];const $=id=>document.getElementById(id),show=(id,on=true)=>$(id).classList.toggle('hidden',!on),fmt=ms=>{let s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return[h,m,x].map(v=>String(v).padStart(2,'0')).join(':')};async function fn(body){const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||'حدث خطأ');return j}async function loadEmployees(){try{const j=await fn({action:'employees'});$('employeeList').innerHTML=(j.employees||[]).map(e=>`<button class="nameBtn" data-id="${e.id}">${e.full_name||'بدون اسم'}</button>`).join('')||'<p class="muted">لا يوجد موظفون مفعلون</p>';document.querySelectorAll('.nameBtn').forEach(b=>b.onclick=()=>selectEmployee(b.dataset.id));}catch(e){$('kioskMsg').textContent=e.message}}async function selectEmployee(id){selected=id;$('kioskMsg').textContent='';show('kiosk',false);show('employeeView');await loadEmployee()}async function loadEmployee(){try{const j=await fn({action:'status',employee_id:selected});$('employeeName').textContent=j.employee.full_name;open=j.open||null;show('checkIn',!open);show('checkOut',!!open);$('status').textContent=open?'حاضر':'غير حاضر';if(timerInt)clearInterval(timerInt);const tick=()=>$('timer').textContent=open?fmt(Date.now()-new Date(open.check_in).getTime()):'00:00:00';tick();if(open)timerInt=setInterval(tick,1000);$('myHistory').innerHTML=(j.data||[]).map(r=>`<div class="row"><div>${new Date(r.check_in).toLocaleString('ar-EG')}</div><div>${r.check_out?fmt(new Date(r.check_out)-new Date(r.check_in)):'مفتوح'}</div></div>`).join('')||'<p class="muted">لا يوجد سجل</p>'}catch(e){$('employeeMsg').textContent=e.message}}$('checkIn').onclick=async()=>{try{await fn({action:'check_in',employee_id:selected});$('employeeMsg').textContent='تم تسجيل الحضور بنجاح';$('employeeMsg').className='success';await loadEmployee()}catch(e){$('employeeMsg').textContent=e.message;$('employeeMsg').className='error'}};$('checkOut').onclick=async()=>{try{await fn({action:'check_out',employee_id:selected});$('employeeMsg').textContent='تم تسجيل الانصراف بنجاح';$('employeeMsg').className='success';await loadEmployee()}catch(e){$('employeeMsg').textContent=e.message;$('employeeMsg').className='error'}};$('employeeBack').onclick=()=>{selected=null;open=null;if(timerInt)clearInterval(timerInt);show('employeeView',false);show('kiosk');loadEmployees()};$('managerLoginBtn').onclick=()=>{show('kiosk',false);show('managerLogin');$('loginMsg').textContent=''};$('backToKiosk').onclick=()=>{show('managerLogin',false);show('kiosk');loadEmployees()};$('loginBtn').onclick=async()=>{const email=$('loginId').value.trim(),password=$('password').value;$('loginMsg').textContent='';if(!email||!password){$('loginMsg').textContent='اكتب البريد وكلمة المرور.';return}const{error}=await sb.auth.signInWithPassword({email,password});if(error){$('loginMsg').textContent='بيانات الدخول غير صحيحة.';return}await initManager()};async function initManager(){const{data:{user}}=await sb.auth.getUser();if(!user)return;const{data,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error||!data||!data.active||data.role!=='manager'){await sb.auth.signOut();$('loginMsg').textContent='الحساب ليس مديراً.';show('managerLogin');return}show('managerLogin',false);show('kiosk',false);show('managerView');await loadManager()}$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};async function loadManager(){const{data:emps}=await sb.from('profiles').select('*').eq('role','employee').order('full_name');const{data:att}=await sb.from('attendance').select('*').is('check_out',null);$('employeeCount').textContent=(emps||[]).length;$('openCount').textContent=(att||[]).length;$('employees').innerHTML=(emps||[]).map(e=>`<div class="row"><div><strong>${e.full_name||e.email}</strong><div class="muted">${e.phone||e.email}</div></div><span class="pill">${(att||[]).some(a=>a.employee_id===e.id)?'حاضر':'غائب'}</span></div>`).join('')||'<p class="muted">لا يوجد موظفون بعد</p>'}$('reportBtn').onclick=async()=>{let q=sb.from('attendance').select('*,profiles(full_name,email,phone)').order('check_in',{ascending:false});if($('from').value)q=q.gte('check_in',$('from').value+'T00:00:00');if($('to').value){const d=new Date($('to').value+'T00:00:00');d.setDate(d.getDate()+1);q=q.lt('check_in',d.toISOString())}const{data,error}=await q;if(error){alert(error.message);return}reportRows=data||[];$('report').innerHTML=reportRows.map(r=>`<div class="row"><div><strong>${r.profiles?.full_name||r.profiles?.email||''}</strong><div class="muted">${new Date(r.check_in).toLocaleString('ar-EG')}</div></div><div>${r.check_out?fmt(new Date(r.check_out)-new Date(r.check_in)):'مفتوح'}</div></div>`).join('')||'<p class="muted">لا توجد نتائج</p>'};$('csvBtn').onclick=()=>{if(!reportRows.length){alert('اعرض التقرير أولاً');return}const lines=[['employee','email','phone','check_in','check_out','hours'],...reportRows.map(r=>[r.profiles?.full_name||'',r.profiles?.email||'',r.profiles?.phone||'',r.check_in,r.check_out||'',r.check_out?((new Date(r.check_out)-new Date(r.check_in))/3600000).toFixed(2):''])].map(a=>a.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(','));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='attendance-report.csv';a.click()};async function init(){const{data:{session}}=await sb.auth.getSession();if(session){await initManager();return}show('kiosk');loadEmployees()}init();</script></body></html>
