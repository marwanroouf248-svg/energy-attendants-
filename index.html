<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Gym Staff"><link rel="manifest" href="manifest.webmanifest"><title>Gym Staff</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#f8fafc}main{max-width:760px;margin:auto;padding:24px 16px 48px}.card{background:#151c2f;border:1px solid #26314a;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 8px 30px #0003}h1,h2{margin:0 0 14px}input,button{width:100%;padding:14px;border-radius:12px;border:1px solid #33415f;background:#0f172a;color:white;font-size:16px;margin:6px 0}button{background:#2563eb;border:0;font-weight:700}button.danger{background:#dc2626}button.secondary{background:#334155}.hidden{display:none}.muted{color:#94a3b8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;background:#0f172a;border-radius:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #26314a;padding:12px 0}.row:last-child{border-bottom:0}.pill{padding:5px 9px;border-radius:999px;background:#14532d}.error{color:#fca5a5}.success{color:#86efac}</style></head><body><main><section id="app" class="hidden"><div class="row"><div><h1>Gym Staff</h1><div id="userName" class="muted"></div></div><button id="logout" class="secondary" style="width:auto">خروج</button></div><section id="employeeView" class="card hidden"><h2>الحضور والانصراف</h2><div class="grid"><div class="stat"><div class="muted">الحالة</div><strong id="status">غير حاضر</strong></div><div class="stat"><div class="muted">الوقت</div><strong id="timer">00:00:00</strong></div></div><button id="checkIn">تسجيل حضور</button><button id="checkOut" class="danger hidden">تسجيل انصراف</button><h2 style="margin-top:22px">سجلي</h2><div id="myHistory"></div></section><section id="managerView" class="hidden"><div class="card"><h2>لوحة المدير</h2><div class="grid"><div class="stat"><div class="muted">الموظفون</div><strong id="employeeCount">0</strong></div><div class="stat"><div class="muted">حضور مفتوح</div><strong id="openCount">0</strong></div></div></div><div class="card"><h2>الموظفون</h2><div id="employees"></div></div><div class="card"><h2>تقرير الحضور</h2><input id="from" type="date"><input id="to" type="date"><button id="reportBtn">عرض التقرير</button><button id="csvBtn" class="secondary">تصدير CSV</button><div id="report"></div></div></section></section><section id="login" class="card"><h1>Gym Staff</h1><p class="muted">تسجيل دخول الموظفين والإدارة</p><input id="loginId" type="text" placeholder="رقم الهاتف أو البريد الإلكتروني" autocomplete="username"><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button id="loginBtn">دخول</button><p id="loginMsg" class="error"></p></section></main><script>const SUPABASE_URL='https://kfrshaagrcggcjalsjdu.supabase.co',SUPABASE_KEY='sb_publishable_mKftrB-itebmeA-bdtt6dw_Q3QnxH0_';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let me=null,open=null,timerInt=null,reportRows=[];const $=id=>document.getElementById(id),show=(id,on=true)=>$(id).classList.toggle('hidden',!on),msg=t=>{$('loginMsg').textContent=t},fmt=ms=>{let s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return[h,m,x].map(v=>String(v).padStart(2,'0')).join(':')};function normalizePhone(v){return v.replace(/\D/g,'')}async function loadUser(u){const{data,error}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();if(error||!data||!data.active){await sb.auth.signOut();show('app',false);show('login');msg(error?'تعذر تحميل الحساب.':'الحساب غير مفعل أو غير موجود.');return}me=data;show('login',false);show('app');$('userName').textContent=me.full_name||me.email;if(me.role==='manager'){show('managerView');await loadManager()}else{show('employeeView');await loadEmployee()}}async function init(){const{data:{session}}=await sb.auth.getSession();if(session)await loadUser(session.user);else{show('app',false);show('login')}}$('loginBtn').onclick=async()=>{msg('');const id=$('loginId').value.trim(),password=$('password').value;if(!id||!password){msg('اكتب رقم الهاتف أو البريد الإلكتروني وكلمة المرور.');return}let email=id;if(!id.includes('@')){const{data,error}=await sb.rpc('login_email_for_phone',{p_phone:normalizePhone(id)});if(error||!data){msg('رقم الهاتف غير مسجل.');return}email=data}const{error}=await sb.auth.signInWithPassword({email,password});if(error){msg('بيانات الدخول غير صحيحة.');return}const{data:{user}}=await sb.auth.getUser();if(user)await loadUser(user)};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};async function loadEmployee(){const{data}=await sb.from('attendance').select('*').eq('employee_id',me.id).order('check_in',{ascending:false}).limit(50);open=(data||[]).find(x=>!x.check_out)||null;show('checkIn',!open);show('checkOut',!!open);$('status').textContent=open?'حاضر':'غير حاضر';if(timerInt)clearInterval(timerInt);const tick=()=>$('timer').textContent=open?fmt(Date.now()-new Date(open.check_in).getTime()):'00:00:00';tick();if(open)timerInt=setInterval(tick,1000);$('myHistory').innerHTML=(data||[]).map(r=>`<div class="row"><div>${new Date(r.check_in).toLocaleString('ar-EG')}</div><div>${r.check_out?fmt(new Date(r.check_out)-new Date(r.check_in)):'مفتوح'}</div></div>`).join('')||'<p class="muted">لا يوجد سجل</p>'}$('checkIn').onclick=async()=>{const{data,error}=await sb.from('attendance').insert({employee_id:me.id}).select().single();if(error){alert(error.message);return}open=data;await loadEmployee()};$('checkOut').onclick=async()=>{if(!open)return;const{error}=await sb.from('attendance').update({check_out:new Date().toISOString()}).eq('id',open.id);if(error){alert(error.message);return}await loadEmployee()};async function loadManager(){const{data:emps}=await sb.from('profiles').select('*').eq('role','employee').order('full_name');const{data:att}=await sb.from('attendance').select('*').is('check_out',null);$('employeeCount').textContent=(emps||[]).length;$('openCount').textContent=(att||[]).length;$('employees').innerHTML=(emps||[]).map(e=>`<div class="row"><div><strong>${e.full_name||e.email}</strong><div class="muted">${e.phone||e.email}</div></div><span class="pill">${(att||[]).some(a=>a.employee_id===e.id)?'حاضر':'غائب'}</span></div>`).join('')||'<p class="muted">لا يوجد موظفون بعد</p>'}$('reportBtn').onclick=async()=>{let q=sb.from('attendance').select('*,profiles(full_name,email,phone)').order('check_in',{ascending:false});if($('from').value)q=q.gte('check_in',$('from').value+'T00:00:00');if($('to').value){const d=new Date($('to').value+'T00:00:00');d.setDate(d.getDate()+1);q=q.lt('check_in',d.toISOString())}const{data,error}=await q;if(error){alert(error.message);return}reportRows=data||[];$('report').innerHTML=reportRows.map(r=>`<div class="row"><div><strong>${r.profiles?.full_name||r.profiles?.email||''}</strong><div class="muted">${new Date(r.check_in).toLocaleString('ar-EG')}</div></div><div>${r.check_out?fmt(new Date(r.check_out)-new Date(r.check_in)):'مفتوح'}</div></div>`).join('')||'<p class="muted">لا توجد نتائج</p>'};$('csvBtn').onclick=()=>{if(!reportRows.length){alert('اعرض التقرير أولاً');return}const lines=[['employee','email','phone','check_in','check_out','hours'],...reportRows.map(r=>[r.profiles?.full_name||'',r.profiles?.email||'',r.profiles?.phone||'',r.check_in,r.check_out||'',r.check_out?((new Date(r.check_out)-new Date(r.check_in))/3600000).toFixed(2):''])].map(a=>a.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(','));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='attendance-report.csv';a.click()};sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_OUT')location.reload()});init();</script></body></html>
