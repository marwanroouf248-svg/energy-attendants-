<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Gym Staff"><link rel="manifest" href="manifest.webmanifest"><title>Gym Staff</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#f8fafc}main{max-width:760px;margin:auto;padding:24px 16px 48px}.card{background:#151c2f;border:1px solid #26314a;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 8px 30px #0003}h1,h2{margin:0 0 14px}input,button{width:100%;padding:14px;border-radius:12px;border:1px solid #33415f;background:#0f172a;color:white;font-size:16px;margin:6px 0}button{background:#2563eb;border:0;font-weight:700}button.danger{background:#dc2626}button.secondary{background:#334155}.linkbtn{background:transparent;border:0;color:#93c5fd;padding:8px 0;text-decoration:underline}.hidden{display:none}.muted{color:#94a3b8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px;background:#0f172a;border-radius:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #26314a;padding:12px 0}.row:last-child{border-bottom:0}.pill{padding:5px 9px;border-radius:999px;background:#14532d}.error{color:#fca5a5}.success{color:#86efac}</style></head><body><main><section id="login" class="card"><h1>Gym Staff</h1><p class="muted">تسجيل دخول الموظفين والإدارة</p><input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email"><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button id="loginBtn">دخول</button><button id="resetBtn" class="linkbtn">نسيت كلمة المرور؟</button><p id="loginMsg" class="error"></p></section><section id="recovery" class="card hidden"><h1>تغيير كلمة المرور</h1><p class="muted">اكتب كلمة المرور الجديدة مرتين.</p><input id="newPassword" type="password" placeholder="كلمة المرور الجديدة" autocomplete="new-password"><input id="newPassword2" type="password" placeholder="تأكيد كلمة المرور" autocomplete="new-password"><button id="savePassword">حفظ كلمة المرور</button><p id="recoveryMsg" class="error"></p></section><section id="app" class="hidden"><div class="row"><div><h1>Gym Staff</h1><div id="userName" class="muted"></div></div><button id="logout" class="secondary" style="width:auto">خروج</button></div><section id="employeeView" class="card hidden"><h2>الحضور والانصراف</h2><div class="grid"><div class="stat"><div class="muted">الحالة</div><strong id="status">غير حاضر</strong></div><div class="stat"><div class="muted">الوقت</div><strong id="timer">00:00:00</strong></div></div><button id="checkIn">تسجيل حضور</button><button id="checkOut" class="danger hidden">تسجيل انصراف</button><h2 style="margin-top:22px">سجلي</h2><div id="myHistory"></div></section><section id="managerView" class="hidden"><div class="card"><h2>لوحة المدير</h2><div class="grid"><div class="stat"><div class="muted">الموظفون</div><strong id="employeeCount">0</strong></div><div class="stat"><div class="muted">حضور مفتوح</div><strong id="openCount">0</strong></div></div></div><div class="card"><h2>الموظفون</h2><div id="employees"></div></div><div class="card"><h2>تقرير الحضور</h2><input id="from" type="date"><input id="to" type="date"><button id="reportBtn">عرض التقرير</button><button id="csvBtn" class="secondary">تصدير CSV</button><div id="report"></div></div></section></section></main><script>const SUPABASE_URL='https://kfrshaagrcggcjalsjdu.supabase.co';const SUPABASE_KEY='sb_publishable_mKftrB-itebmeA-bdtt6dw_Q3QnxH0_';const APP_URL='https://energy-attendants.vercel.app/';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let me=null,open=null,timerInt=null,reportRows=[];const $=id=>document.getElementById(id);const show=(id,on=true)=>$(id).classList.toggle('hidden',!on);const msg=(text,ok=false)=>{const el=$('loginMsg');el.textContent=text;el.className=ok?'success':'error'};const fmt=ms=>{let s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return[h,m,x].map(v=>String(v).padStart(2,'0')).join(':')};function showRecovery(){show('login',false);show('app',false);show('recovery',true);$('recoveryMsg').textContent='';$('newPassword').focus()}async function loadUser(u){const{data,error}=await sb.from('profiles').select('*').eq('id',u.id).single();if(error){await sb.auth.signOut();show('app',false);show('login');msg('تم تسجيل الدخول لكن ملف الحساب غير موجود.');return}if(!data.active){await sb.auth.signOut();show('app',false);show('login');msg('هذا الحساب غير مفعل. تواصل مع المدير.');return}me=data;show('login',false);show('recovery',false);show('app');$('userName').textContent=me.full_name||me.email;if(me.role==='manager'){show('managerView');await loadManager()}else{show('employeeView');await loadEmployee()}}async function init(){const recoveryHash=location.hash.includes('type=recovery');if(recoveryHash){showRecovery();const{data:{session}}=await sb.auth.getSession();if(!session){$('recoveryMsg').textContent='رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رابطاً جديداً.'}return}const{data:{session}}=await sb.auth.getSession();if(session)await loadUser(session.user)}$('loginBtn').onclick=async()=>{msg('');const email=$('email').value.trim(),password=$('password').value;if(!email||!password){msg('اكتب البريد الإلكتروني وكلمة المرور.');return}const{error}=await sb.auth.signInWithPassword({email,password});if(error){msg(error.message==='Invalid login credentials'?'البريد الإلكتروني أو كلمة المرور غير صحيحة.':error.message);return}const{data:{user}}=await sb.auth.getUser();if(user)await loadUser(user)};$('resetBtn').onclick=async()=>{const email=$('email').value.trim();if(!email){msg('اكتب البريد الإلكتروني أولاً ثم اضغط نسيت كلمة المرور.');return}const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:APP_URL});if(error){msg(error.message);return}msg('تم إرسال رابط تغيير كلمة المرور إلى البريد الإلكتروني. افتح الرابط من نفس المتصفح.',true)};$('savePassword').onclick=async()=>{const p=$('newPassword').value,p2=$('newPassword2').value;if(p.length<6){$('recoveryMsg').textContent='كلمة المرور يجب أن تكون 6 أحرف أو أرقام على الأقل.';return}if(p!==p2){$('recoveryMsg').textContent='كلمتا المرور غير متطابقتين.';return}$('savePassword').disabled=true;$('recoveryMsg').textContent='جاري حفظ كلمة المرور...';const{error}=await sb.auth.updateUser({password:p});if(error){$('savePassword').disabled=false;$('recoveryMsg').textContent=error.message;return}await sb.auth.signOut();history.replaceState({},document.title,'/');show('recovery',false);show('login');$('email').value='';$('password').value='';msg('تم تغيير كلمة المرور بنجاح. يمكنك تسجيل الدخول الآن.',true);$('savePassword').disabled=false};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};async function loadEmployee(){const{data}=await sb.from('attendance').select('*').eq('employee_id',me.id).order('check_in',{ascending:false}).limit(50);open=(data||[]).find(x=>!x.check_out)||null;show('checkIn',!open);show('checkOut',!!open);$('status').textContent=open?'حاضر':'غير حاضر';if(timerInt)clearInterval(timerInt);const tick=()=>$('timer').textContent=open?fmt(Date.now()-new Date(open.check_in).getTime()):'00:00:00';tick();if(open)timerInt=setInterval(tick,1000);$('myHistory').innerHTML=(data||[]).map(r=>`<div class="row"><div>${new Date(r.check_in).toLocaleString('ar-EG')}</div><div>${r.check_out?fmt(new Date(r.check_out)-new Date(r.check_in)):'مفتوح'}</div></div>`).join('')||'<p class="muted">لا يوجد سجل</p>'}$('checkIn').onclick=async()=>{const{data,error}=await sb.from('attendance').insert({employee_id:me.id}).select().single();if(error){alert(error.message);return}open=data;await loadEmployee()};$('checkOut').onclick=async()=>{if(!open)return;const{error}=await sb.from('attendance').update({check_out:new Date().toISOString()}).eq('id',open.id);if(error){alert(error.message);return}await loadEmployee()};async function loadManager(){const{data:emps}=await sb.from('profiles').select('*').eq('role','employee').order('full_name');const{data:att}=await sb.from('attendance').select('*').is('check_out',null);$('employeeCount').textContent=(emps||[]).length;$('openCount').textContent=(att||[]).length;$('employees').innerHTML=(emps||[]).map(e=>`<div class="row"><div><strong>${e.full_name||e.email}</strong><div class="muted">${e.email}</div></div><span class="pill">${(att||[]).some(a=>a.employee_id===e.id)?'حاضر':'غائب'}</span></div>`).join('')||'<p class="muted">لا يوجد موظفون بعد</p>'}$('reportBtn').onclick=async()=>{let q=sb.from('attendance').select('*,profiles(full_name,email)').order('check_in',{ascending:false});if($('from').value)q=q.gte('check_in',$('from').value+'T00:00:00');if($('to').value){const d=new Date($('to').value+'T00:00:00');d.setDate(d.getDate()+1);q=q.lt('check_in',d.toISOString())}const{data,error}=await q;if(error){alert(error.message);return}reportRows=data||[];$('report').innerHTML=reportRows.map(r=>`<div class="row"><div><strong>${r.profiles?.full_name||r.profiles?.email||''}</strong><div class="muted">${new Date(r.check_in).toLocaleString('ar-EG')}</div></div><div>${r.check_out?fmt(new Date(r.check_out)-new Date(r.check_in)):'مفتوح'}</div></div>`).join('')||'<p class="muted">لا توجد نتائج</p>'};$('csvBtn').onclick=()=>{if(!reportRows.length){alert('اعرض التقرير أولاً');return}const lines=[['employee','email','check_in','check_out','hours'],...reportRows.map(r=>[r.profiles?.full_name||'',r.profiles?.email||'',r.check_in,r.check_out||'',r.check_out?((new Date(r.check_out)-new Date(r.check_in))/3600000).toFixed(2):''])].map(a=>a.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(','));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='attendance-report.csv';a.click()};sb.auth.onAuthStateChange(async(event,session)=>{if(event==='PASSWORD_RECOVERY')showRecovery();if(event==='SIGNED_OUT'&&!location.hash.includes('type=recovery'))location.reload()});if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');init();</script></body></html>
