<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy Plus HR Login</title><style>body{margin:0;font-family:Arial,Tahoma;background:#07111f;color:#fff;min-height:100vh;display:grid;place-items:center}.box{width:min(430px,92vw);background:#101b2d;border:1px solid #24344e;border-radius:20px;padding:28px;box-shadow:0 20px 60px #0008}h1{margin:0 0 6px}.muted{color:#9fb0c7}.field{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #33445e;background:#0b1525;color:#fff}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#22c55e;color:#052e16;font-weight:800;cursor:pointer;margin-top:10px}.err{color:#fecaca;margin-top:10px;min-height:22px}.brand{color:#22c55e}</style></head><body><div class="box"><h1>ENERGY <span class="brand">PLUS</span></h1><p class="muted">HR System — تسجيل الدخول</p><input id="u" class="field" placeholder="اسم المستخدم أو البريد الإلكتروني" autocomplete="username"><input id="p" class="field" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button class="btn" onclick="login()">دخول</button><div id="err" class="err"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const S=supabase.createClient('https://kfrshaagrcggcjalsjdu.supabase.co','sb_publishable_mKftrB-itebmeA-bdtt6dw_Q3QnxH0_');async function login(){const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value,err=document.getElementById('err');err.textContent='جاري تسجيل الدخول...';let email=u.includes('@')?u:u+'@hr.energyplus.local';let {error}=await S.auth.signInWithPassword({email,password:p});if(error){err.textContent='❌ اسم المستخدم أو كلمة المرور غير صحيحة';return}const {data:{session}}=await S.auth.getSession();const r=await fetch('https://kfrshaagrcggcjalsjdu.supabase.co/functions/v1/hr-account-api',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action:'me'})});const j=await r.json();if(!r.ok||!j.account){await S.auth.signOut();err.textContent='❌ الحساب غير مفعّل في نظام HR';return}location.href=j.manager?'./hr.html':'./employee.html'}S.auth.getSession().then(async({data:{session}})=>{if(session){const r=await fetch('https://kfrshaagrcggcjalsjdu.supabase.co/functions/v1/hr-account-api',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action:'me'})});const j=await r.json();if(r.ok&&j.account)location.href=j.manager?'./hr.html':'./employee.html'}});</script></body></html>
