<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy Plus HR Login</title><style>body{margin:0;font-family:Arial,Tahoma;background:#07111f;color:#fff;min-height:100vh;display:grid;place-items:center}.box{width:min(430px,92vw);background:#101b2d;border:1px solid #24344e;border-radius:20px;padding:28px;box-shadow:0 20px 60px #0008}h1{margin:0 0 6px}.muted{color:#9fb0c7}.field{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #33445e;background:#0b1525;color:#fff}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#22c55e;color:#052e16;font-weight:800;cursor:pointer;margin-top:10px}.err{color:#fecaca;margin-top:10px;min-height:22px}.brand{color:#22c55e}</style><style>
*{box-sizing:border-box}
body{font-family:Arial,Tahoma,sans-serif;background:radial-gradient(circle at 50% 0%,#2a210d 0,#0a0a0b 42%,#050506 100%);color:#fff;min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}
body:before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:#d6ad3a12;filter:blur(80px);top:-220px;left:50%;transform:translateX(-50%)}
.box{position:relative;width:min(560px,100%);background:linear-gradient(145deg,#151515,#0d0d0d);border:1px solid #b894351f;border-radius:28px;padding:46px;box-shadow:0 30px 90px #000b,0 0 0 1px #ffffff05;overflow:hidden}
.box:after{content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;background:linear-gradient(135deg,#d8b34a10,transparent 35%,transparent 70%,#d8b34a07)}
.brandmark{width:78px;height:78px;border-radius:22px;margin:0 auto 20px;display:grid;place-items:center;background:linear-gradient(145deg,#e2bd55,#9f7920);color:#090909;font-size:25px;font-weight:1000;box-shadow:0 12px 35px #b88d2d30}
h1{text-align:center;font-size:32px;letter-spacing:1.5px;margin:0 0 8px;font-weight:900}
.brand{color:#d6af45}
.subtitle{text-align:center;color:#a9a9a9;margin:0 0 34px;font-size:15px}
.label{display:block;color:#d8d8d8;font-size:13px;font-weight:700;margin:0 0 8px}
.field{display:block;width:100%;height:58px;padding:0 18px;margin:0 0 18px;border-radius:14px;border:1px solid #333;background:#090909;color:#fff;font-size:16px;outline:none;transition:.2s}
.field::placeholder{color:#777}
.field:focus{border-color:#c9a43d;box-shadow:0 0 0 4px #c9a43d16;background:#0c0c0c}
.btn{width:100%;height:58px;padding:0;border:0;border-radius:14px;background:linear-gradient(135deg,#e0bb50,#a98127);color:#0a0a0a;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 12px 28px #a9822d25;transition:.2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}
.err{color:#f5b5b5;margin-top:16px;min-height:22px;text-align:center;font-size:14px}
.hint{text-align:center;color:#666;font-size:12px;margin-top:22px}
@media(max-width:600px){body{padding:16px}.box{padding:30px 22px;border-radius:22px}.brandmark{width:68px;height:68px;border-radius:18px}h1{font-size:27px}.field,.btn{height:54px}}
</style>
<script>
document.addEventListener('DOMContentLoaded',()=>document.getElementById('u')?.focus());
</script></head><body><div class="box"><div class="brandmark">EP</div><h1>ENERGY <span class="brand">PLUS</span></h1><p class="subtitle">SMART HR • MANAGEMENT</p><label class="label" for="u">البريد الإلكتروني أو اسم المستخدم</label><input id="u" class="field" placeholder="اكتب البريد الإلكتروني" autocomplete="username" dir="ltr"><label class="label" for="p">كلمة المرور</label><input id="p" class="field" type="password" placeholder="اكتب كلمة المرور" autocomplete="current-password" dir="ltr"><button class="btn" onclick="login()">تسجيل الدخول</button><div id="err" class="err"></div><div class="hint">نظام إدارة الموارد البشرية — Energy Plus</div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const S=supabase.createClient('https://kfrshaagrcggcjalsjdu.supabase.co','sb_publishable_mKftrB-itebmeA-bdtt6dw_Q3QnxH0_');async function login(){const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value,err=document.getElementById('err');err.textContent='جاري تسجيل الدخول...';let email=u.includes('@')?u:u+'@hr.energyplus.local';let {error}=await S.auth.signInWithPassword({email,password:p});if(error){err.textContent='❌ اسم المستخدم أو كلمة المرور غير صحيحة';return}const {data:{session}}=await S.auth.getSession();const r=await fetch('https://kfrshaagrcggcjalsjdu.supabase.co/functions/v1/hr-account-api',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action:'me'})});const j=await r.json();if(!r.ok||!j.account){await S.auth.signOut();err.textContent='❌ الحساب غير مفعّل في نظام HR';return}location.href=j.manager?'./hr.html':'./employee.html'}S.auth.getSession().then(async({data:{session}})=>{if(session){const r=await fetch('https://kfrshaagrcggcjalsjdu.supabase.co/functions/v1/hr-account-api',{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action:'me'})});const j=await r.json();if(r.ok&&j.account)location.href=j.manager?'./hr.html':'./employee.html'}});</script></body></html>
