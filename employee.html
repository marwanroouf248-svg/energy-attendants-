<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy Plus Employee</title><style>body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}.top{background:#111827;color:#fff;padding:18px 24px;display:flex;justify-content:space-between}.wrap{max-width:1100px;margin:auto;padding:24px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav button,.btn{padding:10px 14px;border:1px solid #e7ebf2;background:#fff;border-radius:10px;cursor:pointer}.nav .active,.dark{background:#111827;color:#fff}.section{display:none}.section.show{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #e7ebf2;border-radius:16px;padding:18px}.metric{font-size:30px;font-weight:800}.muted{color:#718096}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #eee}.pill{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700}.green{background:#dcfce7;color:#166534}.yellow{background:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#991b1b}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:15px}}</style><body><div class="top"><div><b>ENERGY <span style="color:#22c55e">PLUS</span></b><div id="hello" style="color:#aab6c8;margin-top:5px">Employee Portal</div></div><button class="btn" onclick="logout()">خروج</button></div><main class="wrap"><div id="nav" class="nav"></div><section id="dashboard" class="section show"><div id="cards" class="grid"></div></section><section id="tasks" class="section"><div class="card"><h2>مهامي اليومية</h2><div id="taskList"></div></div></section><section id="attendance" class="section"><div class="card"><h2>حضوري وانصرافي</h2><div id="attendanceList"></div></div></section><section id="performance" class="section"><div class="card"><h2>الأداء والتقييم</h2><div id="performanceList"></div></div></section><section id="profile" class="section"><div class="card"><h2>بياناتي</h2><div id="profileBox"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const S=supabase.createClient('https://kfrshaagrcggcjalsjdu.supabase.co','sb_publishable_mKftrB-itebmeA-bdtt6dw_Q3QnxH0_'),API='https://kfrshaagrcggcjalsjdu.supabase.co/functions/v1/hr-account-api';let session,data,perms={};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(action){let r=await fetch(API,{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action})}),j=await r.json();if(!r.ok)throw Error(j.error||'خطأ');return j}function show(id,b){document.querySelectorAll('.section').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function status(s){return s==='done'?'<span class="pill green">مكتملة</span>':s==='in_progress'?'<span class="pill yellow">جاري</span>':'<span class="pill red">معلقة</span>'}function render(){let p=data.profile||{};document.getElementById('hello').textContent=(p.full_name||'الموظف')+' • '+(p.branch||'');document.getElementById('cards').innerHTML='<div class="card"><div class="muted">المهام المكتملة</div><div class="metric">'+data.tasks.filter(x=>x.status==='done').length+'/'+data.tasks.length+'</div></div><div class="card"><div class="muted">سجلات الحضور</div><div class="metric">'+data.attendance.length+'</div></div><div class="card"><div class="muted">آخر AI تقييم</div><div class="metric">'+(data.reviews[0]?.ai_score??'—')+(data.reviews[0]?'%':'')+'</div></div>';document.getElementById('taskList').innerHTML=data.tasks.length?data.tasks.map(t=>'<div class="row"><div><b>'+esc(t.title)+'</b><div class="muted">'+esc(t.description||'')+' • '+(t.due_date||'')+'</div></div><div>'+status(t.status)+'</div></div>').join(''):'<p class="muted">لا توجد مهام.</p>';document.getElementById('attendanceList').innerHTML=data.attendance.length?data.attendance.map(a=>'<div class="row"><div>🟢 '+new Date(a.check_in).toLocaleString('ar-EG')+'</div><div>'+(a.check_out?'🔴 '+new Date(a.check_out).toLocaleString('ar-EG'):'مفتوح')+'</div></div>').join(''):'<p class="muted">لا توجد سجلات.</p>';document.getElementById('performanceList').innerHTML=(data.reviews||[]).map(r=>'<div class="row"><div><b>AI Score: '+(r.ai_score??'—')+'%</b><div class="muted">'+esc(r.ai_summary||'')+'</div></div><div>'+esc(r.period_start||'')+' → '+esc(r.period_end||'')+'</div></div>').join('')||'<p class="muted">لا يوجد تقييم بعد.</p>';document.getElementById('profileBox').innerHTML='<div class="row"><b>الاسم</b><span>'+esc(p.full_name)+'</span></div><div class="row"><b>القسم</b><span>'+esc(p.department||'—')+'</span></div><div class="row"><b>الفرع</b><span>'+esc(p.branch||'—')+'</span></div><div class="row"><b>كود الموظف</b><span>'+esc(p.employee_code||'—')+'</span></div>'}async function boot(){let g=await S.auth.getSession();session=g.data.session;if(!session){location.href='./hr-login.html';return}let me=await api('me');if(me.manager){location.href='./hr.html';return}perms=me.account.permissions||{};data=await api('employee_portal');let items=[['dashboard','📊 الرئيسية',true],['tasks','✅ مهامي',perms.tasks],['attendance','🕒 حضوري',perms.attendance],['performance','🤖 أدائي',perms.performance],['profile','👤 بياناتي',perms.profile]];document.getElementById('nav').innerHTML=items.filter(x=>x[2]).map((x,i)=>'<button class="'+(!i?'active':'')+'" onclick="show(\''+x[0]+'\',this)">'+x[1]+'</button>').join('');render()}async function logout(){await S.auth.signOut();location.href='./hr-login.html'}boot().catch(e=>document.body.innerHTML='<div style="padding:40px;text-align:center">❌ '+esc(e.message)+'</div>');</script></body></html>
