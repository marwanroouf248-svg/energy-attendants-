<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy Plus Employee</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#080b10;color:#f5f7fb}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 15% 10%,rgba(229,189,91,.12),transparent 35%),radial-gradient(circle at 85% 20%,rgba(255,255,255,.05),transparent 30%);pointer-events:none}.top{position:sticky;top:0;z-index:50;background:rgba(9,11,15,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(229,189,91,.16);padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:900;letter-spacing:1px}.gold{color:#e5bd5b}.hello{color:#aab3c2;margin-top:5px;font-size:13px}.wrap{max-width:1250px;margin:auto;padding:26px}.nav{position:sticky;top:79px;z-index:40;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;padding:10px;border:1px solid rgba(229,189,91,.14);border-radius:16px;background:rgba(16,19,25,.94);backdrop-filter:blur(12px);box-shadow:0 14px 35px rgba(0,0,0,.28)}.nav button,.btn{padding:11px 15px;border:1px solid #303744;background:#171b23;color:#e9edf5;border-radius:11px;cursor:pointer;font-weight:700}.nav button:hover,.btn:hover{border-color:#e5bd5b}.nav .active,.btn.goldbtn{background:#e5bd5b;color:#111;border-color:#e5bd5b}.section{display:none}.section.show{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:linear-gradient(145deg,#141821,#0e1117);border:1px solid rgba(229,189,91,.14);border-radius:18px;padding:20px;box-shadow:0 16px 35px rgba(0,0,0,.2)}.metric{font-size:32px;font-weight:900}.muted{color:#9da7b7}.row{display:flex;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #252b35}.pill{padding:6px 10px;border-radius:999px;font-size:11px;font-weight:800}.green{background:#173a29;color:#8ee7ae}.yellow{background:#453817;color:#f7d98a}.red{background:#431d24;color:#ff9aa8}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field,input,select,textarea{width:100%;padding:12px 13px;border:1px solid #303744;background:#0e1218;color:#fff;border-radius:11px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.76);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}.modal.show{display:flex}.modalbox{width:min(760px,100%);max-height:90vh;overflow:auto;background:#12161e;border:1px solid rgba(229,189,91,.2);border-radius:20px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.55)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.notice{padding:12px;border-radius:12px;background:#171c25;border:1px solid #303744;margin:10px 0}.request{border-right:3px solid #e5bd5b}.request.pending{border-right-color:#e5bd5b}.request.approved{border-right-color:#45d483}.request.rejected{border-right-color:#ff667a}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:15px}.nav{top:70px;overflow-x:auto;flex-wrap:nowrap}.nav button{white-space:nowrap}.formgrid{grid-template-columns:1fr}.top{padding:13px 15px}}
</style><body><div class="top"><div><div class="brand">ENERGY <span class="gold">PLUS</span></div><div id="hello" class="hello">بوابة الموظف</div></div><button class="btn" onclick="logout()">تسجيل الخروج</button></div><main class="wrap"><div id="nav" class="nav"></div><div id="noticeBox"></div><section id="dashboard" class="section show"><div id="cards" class="grid"></div><div class="card" style="margin-top:16px"><h2>💰 دخلي ومرتبـي</h2><div id="financeSummary"></div></div></section><section id="finance" class="section"><div class="card"><h2>💰 الدخل اليومي والمرتب</h2><div id="financeDetails"></div></div></section><section id="tasks" class="section"><div class="card"><h2>مهامي اليومية</h2><div id="taskList"></div></div></section><section id="attendance" class="section"><div class="card"><h2>حضوري وانصرافي</h2><div id="attendanceList"></div></div></section><section id="performance" class="section"><div class="card"><h2>الأداء والتقييم</h2><div id="performanceList"></div></div></section><section id="leave" class="section"><div class="card"><h2>الإجازات والطلبات</h2><p class="muted">قدّم طلب إجازة، واكتب السبب، وتابع حالة الطلب بعد إرساله للمدير.</p><div class="formgrid"><select id="leaveType"></select><input id="leaveStart" type="date"><input id="leaveEnd" type="date"><textarea id="leaveReason" placeholder="سبب الإجازة / ملاحظاتك"></textarea></div><div class="actions"><button class="btn goldbtn" onclick="submitLeave()">إرسال طلب الإجازة</button></div><hr style="border-color:#252b35;margin:22px 0"><div id="leaveList"></div></div></section><section id="requests" class="section"><div class="card"><h2>طلباتي</h2><div class="actions"><button class="btn goldbtn" onclick="openLoan()">طلب سلفة</button></div><div id="requestsList"></div></div></section><section id="profile" class="section"><div class="card"><h2>بياناتي</h2><div id="profileBox"></div></div></section></main><div id="loanModal" class="modal"><div class="modalbox"><button class="btn" onclick="closeLoan()">إغلاق</button><h2>طلب سلفة</h2><div class="formgrid"><input id="loanAmount" type="number" min="1" placeholder="قيمة السلفة"><input id="loanInstallments" type="number" min="1" value="1" placeholder="عدد الأقساط"><input id="loanStart" type="date"><textarea id="loanReason" placeholder="سبب السلفة"></textarea></div><div class="actions"><button class="btn goldbtn" onclick="submitLoan()">إرسال الطلب</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const S=supabase.createClient('https://kfrshaagrcggcjalsjdu.supabase.co','sb_publishable_mKftrB-itebmeA-bdtt6dw_Q3QnxH0_'),API='https://kfrshaagrcggcjalsjdu.supabase.co/functions/v1/hr-account-api';let session,data,perms={};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(action,extra={}){let r=await fetch(API,{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({action,...extra})}),j=await r.json();if(!r.ok)throw Error(j.error||'خطأ');return j}function show(id,b){document.querySelectorAll('.section').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function status(s){return s==='done'?'<span class="pill green">مكتملة</span>':s==='in_progress'?'<span class="pill yellow">جاري</span>':'<span class="pill red">معلقة</span>'}function leaveStatus(s){if(s==='approved')return '<span class="pill green">مقبولة</span>';if(s==='rejected')return '<span class="pill red">مرفوضة</span>';if(s==='cancelled')return '<span class="pill red">ملغاة</span>';return '<span class="pill yellow">قيد المراجعة</span>'}
function render(){
let p=data.profile||{};
document.getElementById('hello').textContent=(p.full_name||'الموظف')+' • '+(p.department||'')+' • '+(p.branch||'');
document.getElementById('cards').innerHTML='<div class="card"><div class="muted">المهام المكتملة</div><div class="metric">'+data.tasks.filter(x=>x.status==='done').length+'/'+data.tasks.length+'</div></div><div class="card"><div class="muted">سجلات الحضور</div><div class="metric">'+data.attendance.length+'</div></div><div class="card"><div class="muted">طلبات الإجازة</div><div class="metric">'+(data.leaves||[]).length+'</div></div>';
document.getElementById('taskList').innerHTML=data.tasks.length?data.tasks.map(t=>'<div class="row"><div><b>'+esc(t.title)+'</b><div class="muted">'+esc(t.description||'')+' • '+(t.due_date||'')+'</div></div><div>'+status(t.status)+'</div></div>').join(''):'<p class="muted">لا توجد مهام.</p>';
document.getElementById('attendanceList').innerHTML=data.attendance.length?data.attendance.map(a=>'<div class="row"><div>🟢 '+new Date(a.check_in).toLocaleString('ar-EG')+'</div><div>'+(a.check_out?'🔴 '+new Date(a.check_out).toLocaleString('ar-EG'):'مفتوح')+'</div></div>').join(''):'<p class="muted">لا توجد سجلات.</p>';
document.getElementById('performanceList').innerHTML=(data.reviews||[]).map(r=>'<div class="row"><div><b>التقييم: '+(r.ai_score??'—')+'%</b><div class="muted">'+esc(r.ai_summary||'')+'</div></div><div>'+esc(r.period_start||'')+' → '+esc(r.period_end||'')+'</div></div>').join('')||'<p class="muted">لا يوجد تقييم بعد.</p>';
document.getElementById('profileBox').innerHTML='<div class="row"><b>الاسم</b><span>'+esc(p.full_name)+'</span></div><div class="row"><b>القسم</b><span>'+esc(p.department||'—')+'</span></div><div class="row"><b>الفرع</b><span>'+esc(p.branch||'—')+'</span></div><div class="row"><b>كود الموظف</b><span>'+esc(p.employee_code||'—')+'</span></div>';
const list=data.leaves||[];const html=list.length?list.map(x=>'<div class="notice request '+esc(x.status||'pending')+'"><div style="display:flex;justify-content:space-between;gap:10px"><b>'+esc(x.hr_leave_types?.name_ar||x.hr_leave_types?.name||'إجازة')+'</b>'+leaveStatus(x.status)+'</div><div class="muted">'+esc(x.start_date)+' → '+esc(x.end_date)+' • '+esc(x.days)+' يوم</div><div>'+esc(x.reason||'بدون سبب مكتوب')+'</div>'+(x.decision_note?'<div class="muted">رد المدير: '+esc(x.decision_note)+'</div>':'')+'</div>').join(''):'<p class="muted">لا توجد طلبات إجازة حتى الآن.</p>';document.getElementById('leaveList').innerHTML=html;document.getElementById('requestsList').innerHTML=html;renderFinance();renderRequests();
}
function money(v){return Number(v||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م'}
function loanStatus(s){if(s==='active')return '<span class="pill green">فعالة</span>';if(s==='rejected')return '<span class="pill red">مرفوضة</span>';if(s==='cancelled')return '<span class="pill red">ملغاة</span>';return '<span class="pill yellow">قيد المراجعة</span>'}
function renderFinance(){const f=data.finance||{};const comp=(f.compensation||[])[0]||{};const rows=f.dailyEarnings||[];const month=new Date().toISOString().slice(0,7);const mr=rows.filter(x=>String(x.work_date||'').slice(0,7)===month);const total=mr.reduce((s,x)=>s+Number(x.net_earning||0),0),priv=mr.reduce((s,x)=>s+Number(x.private_earning||0),0),ded=mr.reduce((s,x)=>s+Number(x.deductions||0),0);const active=(f.loans||[]).find(x=>x.status==='active');const remaining=Number(active?.remaining_amount||0);const salary=Number(comp.basic_salary||0);document.getElementById('financeSummary').innerHTML='<div class="grid"><div><div class="muted">الراتب الأساسي</div><div class="metric">'+money(salary)+'</div></div><div><div class="muted">دخل الشهر حتى الآن</div><div class="metric">'+money(total)+'</div></div><div><div class="muted">البرايفيت هذا الشهر</div><div class="metric">'+money(priv)+'</div></div><div><div class="muted">الخصومات</div><div class="metric">'+money(ded)+'</div></div><div><div class="muted">السلفة المتبقية</div><div class="metric">'+money(remaining)+'</div></div></div>';
let today=rows.find(x=>x.work_date===new Date().toISOString().slice(0,10));let coach=String(data.profile?.department||'').toLowerCase()==='coach';document.getElementById('financeDetails').innerHTML='<div class="grid"><div class="card"><div class="muted">دخل اليوم</div><div class="metric">'+money(today?.net_earning)+'</div><div class="row"><b>ساعات الشيفت</b><span>'+Number(today?.shift_hours||0).toFixed(2)+'</span></div><div class="row"><b>سعر الساعة</b><span>'+money(today?.hourly_rate)+'</span></div><div class="row"><b>دخل الشيفت</b><span>'+money(today?.shift_earning)+'</span></div>'+(coach?'<div class="row"><b>البرايفيت</b><span>'+money(today?.private_earning)+'</span></div>':'')+'<div class="row"><b>دخل إضافي</b><span>'+money(today?.other_earning)+'</span></div><div class="row"><b>الخصومات</b><span>'+money(today?.deductions)+'</span></div></div><div class="card"><h3>السلفة</h3>'+(active?'<div class="row"><b>الحالة</b><span>'+loanStatus(active.status)+'</span></div><div class="row"><b>قيمة السلفة</b><span>'+money(active.amount)+'</span></div><div class="row"><b>القسط</b><span>'+money(active.installment_amount)+'</span></div><div class="row"><b>المتبقي</b><span>'+money(active.remaining_amount)+'</span></div>':'<p class="muted">لا توجد سلفة فعالة.</p>')+'</div></div><h3 style="margin-top:22px">آخر أيام الدخل</h3>'+(rows.length?rows.slice(0,30).map(x=>'<div class="row"><div><b>'+esc(x.work_date)+'</b><div class="muted">'+Number(x.shift_hours||0).toFixed(2)+' ساعة • شيفت '+money(x.shift_earning)+(coach?' • برايفيت '+money(x.private_earning):'')+'</div></div><strong>'+money(x.net_earning)+'</strong></div>').join(''):'<p class="muted">لم يتم تسجيل دخل يومي بعد.</p>')+'<h3 style="margin-top:22px">تعويضاتي الحالية</h3><div class="row"><b>الراتب الأساسي</b><span>'+money(comp.basic_salary)+'</span></div><div class="row"><b>سعر الساعة</b><span>'+money(comp.hourly_rate)+'</span></div>'+(coach?'<div class="row"><b>سعر البرايفيت</b><span>'+money(comp.private_session_rate)+'</span></div><div class="row"><b>نسبة البرايفيت</b><span>'+Number(comp.private_share_percent||0)+'%</span></div>':'')+'<div class="row"><b>طريقة الدفع</b><span>'+esc(comp.payment_method||'—')+'</span></div></div>';
}
function openLoan(){document.getElementById('loanModal').classList.add('show')}
function closeLoan(){document.getElementById('loanModal').classList.remove('show')}
async function submitLoan(){const amount=Number(document.getElementById('loanAmount').value||0),installments=Number(document.getElementById('loanInstallments').value||1),start_date=document.getElementById('loanStart').value,reason=document.getElementById('loanReason').value.trim();if(amount<=0){alert('اكتب قيمة السلفة');return}try{await api('request_loan',{amount,installments,deduction_start_date:start_date||new Date().toISOString().slice(0,10),reason});closeLoan();document.getElementById('loanReason').value='';await reloadFinance();alert('تم إرسال طلب السلفة للمدير')}catch(e){alert('تعذر إرسال الطلب: '+e.message)}}
async function reloadFinance(){const x=await api('employee_360',{employee_id:data.profile.id});data.finance=x;renderFinance();renderRequests()}
function renderRequests(){const leaves=data.leaves||[],loans=(data.finance?.loans||[]);let html=leaves.map(x=>'<div class="notice request '+esc(x.status||'pending')+'"><b>إجازة</b> '+leaveStatus(x.status)+'<div class="muted">'+esc(x.start_date)+' → '+esc(x.end_date)+' • '+esc(x.days)+' يوم</div><div>'+esc(x.reason||'بدون سبب')+'</div></div>').join('');html+=loans.map(x=>'<div class="notice request '+esc(x.status||'pending')+'"><b>سلفة</b> '+loanStatus(x.status)+'<div class="muted">قيمة '+money(x.amount)+' • '+Number(x.installments||0)+' أقساط</div><div>المتبقي: '+money(x.remaining_amount)+'</div></div>').join('');document.getElementById('requestsList').innerHTML=html||'<p class="muted">لا توجد طلبات حتى الآن.</p>'}
async function loadLeaveTypes(){let r=await api('employee_leave_data');document.getElementById('leaveType').innerHTML=(r.leaveTypes||[]).map(x=>'<option value="'+x.id+'">'+esc(x.name_ar||x.name)+'</option>').join('')||'<option value="">لا توجد أنواع إجازات</option>'}
async function submitLeave(){let leave_type_id=document.getElementById('leaveType').value,start_date=document.getElementById('leaveStart').value,end_date=document.getElementById('leaveEnd').value,reason=document.getElementById('leaveReason').value.trim();if(!leave_type_id||!start_date||!end_date){alert('اختر نوع الإجازة وتاريخ البداية والنهاية');return}if(end_date<start_date){alert('تاريخ النهاية يجب أن يكون بعد البداية');return}try{await api('request_leave',{leave_type_id,start_date,end_date,reason});document.getElementById('leaveReason').value='';await reloadPortal();alert('تم إرسال طلب الإجازة للمدير بنجاح')}catch(e){alert('تعذر إرسال الطلب: '+e.message)}}
async function reloadPortal(){data=await api('employee_portal');render()}
async function boot(){let g=await S.auth.getSession();session=g.data.session;if(!session){location.href='./hr-login.html';return}let me=await api('me');if(me.manager){location.href='./hr.html';return}perms=me.account.permissions||{};data=await api('employee_portal');data.finance=await api('employee_360',{employee_id:data.profile.id});let items=[['dashboard','📊 الرئيسية',true],['tasks','✅ مهامي',perms.tasks],['attendance','🕒 حضوري',perms.attendance],['performance','⭐ أدائي',perms.performance],['leave','🏖️ الإجازات',true],['requests','📋 طلباتي',true],['finance','💰 دخلي',true],['profile','👤 بياناتي',true]];document.getElementById('nav').innerHTML=items.filter(x=>x[2]).map((x,i)=>'<button class="'+(!i?'active':'')+'" onclick="show(\''+x[0]+'\',this)">'+x[1]+'</button>').join('');await loadLeaveTypes();render()}
async function logout(){await S.auth.signOut();location.href='./hr-login.html'}boot().catch(e=>document.body.innerHTML='<div style="padding:40px;text-align:center">❌ '+esc(e.message)+'</div>');</script></body></html>
