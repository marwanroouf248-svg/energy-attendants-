ist.add('hidden');$('dash').classList.remove('hidden')}function logout(){token='';localStorage.removeItem('energy_manager_token');location.reload()}async function summary(){try{let j=await api('manager_summary');employees=j.employees||[];$('count').textContent=employees.length;$('open').textContent=(j.open||[]).length;$('employees').innerHTML=employees.map(e=>`<div class="employee-card"><div class="row"><div><b>${esc(e.full_name)}</b><div class="muted">${esc(e.branch||'')} - ${esc(e.department||'')}</div></div><div>${(j.open||[]).some(a=>a.employee_id===e.id)?'حاضر':'غائب'}</div></div></div>`).join('');$('employeeFilter').innerHTML='<option value="">كل الموظفين</option>'+employees.map(e=>`<option value="${e.id}">${esc(e.full_name)}</option>`).join('')}catch(e){logout()}}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function hours(r){return r.check_out?Math.max(0,(new Date(r.check_out)-new Date(r.check_in))/3600000):0}function fmtDate(v){return v?new Date(v).toLocaleString('ar-EG'):'—'}function getTotals(){let totals={};rows.forEach(r=>{let e=r.profiles||{};let key=r.employee_id;if(!totals[key])totals[key]={id:key,name:e.full_name||'',branch:e.branch||'',department:e.department||'',hours:0,open:0,count:0};totals[key].count++;if(r.check_out)totals[key].hours+=hours(r);else totals[key].open++});return Object.values(totals).sort((a,b)=>b.hours-a.hours)}async function report(){try{let body={from:$('from').value,to:$('to').value};if($('employeeFilter').value)body.employee_id=$('employeeFilter').value;let j=await api('manager_report',body);rows=j.rows||[];let totals=getTotals();$('grandHours').textContent=totals.reduce((s,t)=>s+t.hours,0).toFixed(2);$('recordCount').textContent=rows.length;$('totals').innerHTML=totals.map(t=>`<div class="row"><div><b>${esc(t.name)}</b><div class="muted">${esc(t.branch)} - ${esc(t.department)} | ${t.count} سجل</div></div><div class="total">${t.hours.toFixed(2)}
